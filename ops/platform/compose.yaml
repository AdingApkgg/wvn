services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: wvn
      POSTGRES_DB: wvn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports: ["127.0.0.1:${PG_PORT:-25432}:5432"]
    volumes:
      - postgres:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/10-wvn.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wvn -d wvn"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction"]
    ports: ["127.0.0.1:${REDIS_PORT:-26379}:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m
    cpus: 1
    restart: unless-stopped
  meilisearch:
    image: getmeili/meilisearch:v1.53
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?required}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: 512Mb
      MEILI_MAX_INDEXING_THREADS: 2
    ports: ["127.0.0.1:${MEILI_PORT:-27700}:7700"]
    volumes: ["meilisearch:/meili_data"]
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
volumes:
  postgres:
  meilisearch:
