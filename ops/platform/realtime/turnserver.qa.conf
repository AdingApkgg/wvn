# 严格回环隔离QA专用，禁止直接用于生产。secret由任务私有文件追加。
listening-ip=127.0.0.1
relay-ip=127.0.0.1
listening-port=28440
min-port=28450
max-port=28469
realm=wvn-rooms-loopback-qa
use-auth-secret
fingerprint
allow-loopback-peers
no-multicast-peers
no-cli
no-tls
no-dtls
no-tcp-relay
no-rfc5780
relay-threads=1
user-quota=8
total-quota=16
max-allocate-lifetime=600
log-file=stdout
simple-log
